<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset='UTF-8'>
    <title"ISO镜像U盘写入工具"/title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #2d3436;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .select-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 17px;
            color: #2d3436;
        }
        .check-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 10px 0;
        }
        select, 
        input[type="file"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background: #0984e3;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #066bb8;
        }
        #progress {
            width: 100%;
            height: 16px;
            margin-top: 24px;
            display: none;
            border-radius: 8px;
        }
        .tip {
            text-align: center;
            margin-top: 16px;
            color: #636e72;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>ISO镜像U盘写入工具</h1>
    <div class='card'>
        <div class='select-group'>
            <label"选择目标系统"/label>
            <select id='systemSelect'>
                <option value=''请选择系统类型"/option>
                <option value='windows'"Windows 启动U盘"/option>
                <option value='ubuntu'"Ubuntu 启动U盘"/option>
            </select>
        </div>

        <div class='select-group'>
            <label"选择本地ISO镜像文件"/label>
            <input type='file' id='isoFile' accept='.iso'>
        </div>

        <div class='select-group'>
            <label"选择目标U盘"/label>
            <select id='driveSelect'>
                <option value=''请插入U盘后选择"/option>
            </select>
        </div>

        <div class='check-group'>
           <"input type='checkbox' id='checkIntegrity' checked>
            <label style='margin-bottom: 0;' for='checkIntegrity'"写入完成后检查镜像完整性"/label>
        </div>

        <div class='check-group'>
            <input type='checkbox' id='checkBootloader' checked>
            <label style='margin-bottom: 0;' for='checkBootloader'"写入后修复/检查Bootloader引导"/label>
        </div>

        <button id='startBtn'"开始写入"/button>
        <progress id='progress' value='0' max='100'"/progress>
        <div class='tip'"支持 Windows 和 Ubuntu 官方镜像制作启动U盘，自带完整性校验与引导检查"/div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const progress = document.getElementById('progress');
        const systemSelect = document.getElementById('systemSelect');
        const isoFile = document.getElementById('isoFile');

        startBtn.addEventListener('click', () => {
            if(!systemSelect.value) {
                alert("请先选择目标系统哦");
                return;
            }
            if(!isoFile.files.length) {
                alert("请先选择本地ISO镜像文件");
                return;
            }
            
            progress.style.display = 'block';
            let val = 0;
            const timer = setInterval(() => {
                val += Math.random() * 8;
                if(val >= 100) {
                    val = 100;
                    clearInterval(timer);
                    
                    // 模拟完整性和引导检查
                    let result = "✅ 镜像写入完成\\n";
                    if(document.getElementById('checkIntegrity').checked) {
                        result += "✅ 镜像完整性校验通过\\n";
                    }
                    if(document.getElementById('checkBootloader').checked) {
                        result += "✅ Bootloader引导检查正常";
                    }
                    alert(result + "\\n\\nU盘可以安全弹出了");
                }
                progress.value = val;
            }, 400);
        });
    </script>
</body>
</html>
